Name: Stride Development
Summary: Development builds of the Stride task management application.
Description: |-
  Stride is a task management application with built-in Git integration.
  Create and sync tasks using a Git provider such as GitHub, GitLab, or
  SourceHut, or use a self-hosted server.

  Stride is currently in alpha, so features and behavior may change.

  This development build includes the latest changes and may be unstable.

  Stride Development and Stride can be installed alongside each other.
